<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Buddy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --bg:#f1ecff;--card:#ffffff;--ink:#2b2350;--soft:#7a71a6;--line:#ddd5f7;--done:#3ccf91;--donebg:#d9f7ea;
  --push1:#ff7eb6;--push2:#ffb84d;--pull1:#6c8cff;--pull2:#38d0c4;--accent:#ff7eb6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1733;--card:#2a2350;--ink:#f3efff;--soft:#a79fd0;--line:#41386f;--donebg:#1d4a40;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:2.2rem;margin:8px 0 2px;font-weight:700}
.sub{color:var(--soft);margin:0 0 22px;font-size:1.05rem}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.grid{display:flex;flex-direction:column;gap:14px}
.pick{border-radius:28px;padding:16px 24px;text-align:left;color:#2b2350;min-height:max(110px,calc((100vh - 230px)/4));min-height:max(110px,calc((100dvh - 230px)/4));display:flex;flex-direction:row;align-items:center;gap:20px;box-shadow:0 6px 0 rgba(43,35,80,.18);transition:transform .12s}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,80,.18)}
.pick .em{font-size:3rem;line-height:1}
.pick b{font-size:1.75rem;display:block;font-weight:700}
.pick small{font-size:.9rem;opacity:.8}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.round{background:var(--card);border-radius:50%;width:44px;height:44px;font-size:1.3rem;box-shadow:0 3px 0 var(--line)}
.top h2{margin:0;font-size:1.6rem;flex:1;font-weight:700}
.bar{height:16px;background:var(--card);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.count{color:var(--soft);margin:8px 2px 14px;font-size:.98rem}
/* one big card per screen */
.ex,.box{margin-bottom:16px;border-radius:28px;padding:18px;display:flex;flex-direction:column;box-shadow:0 5px 0 var(--line);transition:background .25s,border-color .25s}
.ex{justify-content:center;align-items:center;text-align:center;background:rgba(var(--g),.3);border:3px solid rgba(var(--g),.75)}
.ex.complete{background:var(--donebg);border-color:var(--done)}
.ex.skipped{opacity:.5}
.ex.skipped .sets{pointer-events:none}
.chip{background:rgba(var(--g),.9);color:#2b2350;border-radius:99px;padding:5px 16px;font-size:.95rem;font-weight:600}
.name{font-size:2rem;font-weight:700;margin:14px 0 4px;line-height:1.15}
.meta{color:var(--soft);font-size:1.05rem}
.last{color:var(--soft);font-size:.9rem;margin-top:6px;line-height:1.4}
.ex{padding-left:12px;padding-right:12px}
.sets{width:100%;display:flex;flex-direction:column;gap:12px;margin:24px 0 6px}
.srow{display:grid;grid-template-columns:40px 1fr auto 1fr auto 48px;align-items:center;gap:6px;width:100%}
.snum{height:48px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;font-weight:600;background:var(--bg)}
.srow input{width:100%;min-width:0;height:48px;padding:0 2px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.15rem;text-align:center}
.srow.done input{background:var(--donebg);border-color:var(--done)}
.u{color:var(--soft);font-size:.75rem}
.ok{height:48px;width:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--line);font-size:1.5rem;font-weight:700}
.ok:active{transform:scale(.9)}
.ok.on{background:var(--done);border-color:var(--done);color:#fff}
.ok.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.skip{margin-top:22px;background:transparent;color:var(--soft);font-size:.9rem;padding:8px 16px;border-radius:99px;border:2px solid var(--line)}
.box{background:var(--card);border:3px dashed var(--line)}
.box h3{margin:0 0 10px;font-size:1.7rem;font-weight:700}
.chk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;padding:13px 2px;font-size:1.12rem;border-radius:14px}
.chk i{flex:none;width:34px;height:34px;border-radius:11px;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700;background:var(--bg)}
.chk.on i{background:var(--done);border-color:var(--done);animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.chk.on span{text-decoration:line-through;color:var(--soft)}
/* bottom nav + rest timer */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);z-index:4}
.fin{display:block;width:100%;margin:4px 0 20px}
.nb{flex:1;border-radius:99px;padding:16px;font-size:1.15rem;font-weight:600;background:var(--card);box-shadow:0 3px 0 var(--line)}
.nb.main{flex:2;background:var(--accent);color:#2b2350}
#rt{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:#2b2350;color:#fff;border-radius:99px;padding:14px 20px;font-size:1.05rem;font-weight:600;box-shadow:0 5px 0 rgba(43,35,80,.3)}
#rt.run{background:var(--accent);color:#2b2350}
#rt.ding{background:var(--done);color:#fff;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
#sheet{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card);border-radius:24px;padding:14px;width:230px;box-shadow:0 8px 24px rgba(43,35,80,.3),0 0 0 2px var(--line)}
#sheet b{display:block;margin:0 0 10px;font-size:1.1rem}
#sheet .pre{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sheet .pre button{background:var(--bg);border-radius:16px;padding:14px 0;font-size:1.05rem;font-weight:600}
#tstop{width:100%;margin-top:10px;background:transparent;border:2px solid var(--line);border-radius:16px;padding:10px;color:var(--soft)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti span{position:absolute;top:-40px;font-size:1.8rem;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>Gym buddy 💪</h1>
    <p class="sub">What are we doing today?</p>
    <div class="grid" id="picks"></div>
  </section>
  <section id="workout" hidden>
    <div class="top">
      <button class="round" id="back" aria-label="Back to menu">←</button>
      <h2 id="wtitle"></h2>
      <button class="round" id="reset" aria-label="Start this workout over">↺</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <p class="count" id="count"></p>
    <div id="stage"></div>
  </section>
</main>
<button id="rt" hidden>⏱ Rest</button>
<div id="sheet" hidden>
  <b>Rest timer</b>
  <div class="pre">
    <button data-s="30">30 sec</button><button data-s="60">1 min</button>
    <button data-s="90">1:30</button><button data-s="120">2 min</button>
  </div>
  <button id="tstop" hidden>Stop timer</button>
</div>

<script>
var PROGRAM = {
  push1:{title:'Push 1',em:'🍑',color:'var(--push1)',ex:[
    ['Side planks',2,'30 sec per side'],['Abs',3,'15 reps'],['Hip thrust',3,'8-10 reps'],
    ['Lunges / Bulgarian',3,'8-10 per leg'],['Chest bar / dumbbells',3,'8-10 reps'],
    ['Shoulder press',3,'8-10 reps'],['Triceps rope pushdown',3,'10-12 reps'],['Leg press, legs low',3,'10-12 reps']]},
  push2:{title:'Push 2',em:'🔥',color:'var(--push2)',ex:[
    ['Normal planks',2,'45 sec'],['Abs',3,'15 reps'],['Squats (bar)',3,'6-8 reps'],
    ['Hip thrust',3,'8-10 reps'],['Push-ups, open for chest',3,'10-15 reps'],
    ['Triceps row',3,'10-12 reps'],['Step-ups',3,'10 per leg']]},
  pull1:{title:'Pull 1',em:'🦋',color:'var(--pull1)',ex:[
    ['Lower back extensors',3,'12-15 reps'],['RDLs (bar)',3,'6-8 reps'],
    ['Sumo squat',3,'10-12 reps'],['Lat pulldown',3,'8-12 reps'],
    ['Biceps (bar or dumbbells)',3,'10-12 reps'],['Row, open elbows',3,'10-12 reps'],
    ['Kick backs',3,'12-15 per leg']]},
  pull2:{title:'Pull 2',em:'🚀',color:'var(--pull2)',ex:[
    ['Side abs',3,'12 per side'],['Single leg RDLs',3,'8-10 per leg'],
    ['Side lunges',3,'8 per side'],['Assisted pull-ups',3,'6-10 reps'],
    ['Hammer biceps',3,'10-12 reps'],['Back rows (dumbbell)',3,'10 per side'],
    ['Back extensions',3,'12-15 reps']]}
};
/* muscle groups: label and r,g,b colour */
var GROUPS={glutes:['Glutes','255,126,182'],legs:['Legs','255,160,60'],core:['Core','255,205,60'],
  chest:['Chest','80,170,255'],shoulders:['Shoulders','255,100,100'],back:['Back','100,120,255'],arms:['Arms','160,210,60']};
var GRP={'Side planks':'core','Abs':'core','Normal planks':'core','Side abs':'core','Hip thrust':'glutes','Kick backs':'glutes',
  'Lunges / Bulgarian':'legs','Leg press, legs low':'legs','Squats (bar)':'legs','Step-ups':'legs','RDLs (bar)':'legs',
  'Sumo squat':'legs','Single leg RDLs':'legs','Side lunges':'legs','Chest bar / dumbbells':'chest',
  'Push-ups, open for chest':'chest','Shoulder press':'shoulders','Triceps rope pushdown':'arms','Triceps row':'arms',
  'Biceps (bar or dumbbells)':'arms','Hammer biceps':'arms','Lower back extensors':'back','Lat pulldown':'back',
  'Row, open elbows':'back','Assisted pull-ups':'back','Back rows (dumbbell)':'back','Back extensions':'back'};
var WARM={
  push:['3 min easy bike or incline walk','Leg swings, 10 per leg','Hip circles, 10 each way','Bodyweight squats, 12 reps','Arm circles and band pull-aparts, 15 reps','1-2 light ramp-up sets of your first exercise'],
  pull:['3 min easy bike or incline walk','Leg swings, 10 per leg','Hip circles, 10 each way','Glute bridges, 2 x 15 (squeeze at the top)','Cat-cow, 8 slow reps','1-2 light ramp-up sets of your first exercise']
};
var COOL={
  push:['Hip flexor stretch, 30 sec per side','Quad stretch, 30 sec per side','Pigeon pose, 45 sec per side','Chest doorway stretch, 30 sec','Overhead triceps stretch, 30 sec per side'],
  pull:['Hamstring stretch, 30 sec per side','Figure-4 glute stretch, 45 sec per side','Child pose, 45 sec','Lat stretch on a bar or rack, 30 sec per side','Lying spinal twist, 30 sec per side']
};
var KEY='gymbuddy-v1';
var S={sets:{},lastSets:{},lastKg:{},skip:{},last:{},warm:{},cool:{},page:{}};
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
var cur=null,P=0,wasAll=false;

function fmtLast(k){
  var t=S.last[k];if(!t)return 'Not done yet';
  var d=Math.floor((Date.now()-t)/864e5);
  return d<=0?'Done today':d===1?'Done yesterday':'Done '+d+' days ago';
}
function home(){
  cur=null;stopT(false);
  $('workout').hidden=true;$('rt').hidden=true;$('sheet').hidden=true;$('home').hidden=false;
  var h='';
  Object.keys(PROGRAM).forEach(function(k){
    var p=PROGRAM[k];
    h+='<button class="pick" style="background:'+p.color+'" data-k="'+k+'"><span class="em">'+p.em+'</span><span><b>'+p.title+'</b><small>'+fmtLast(k)+'</small></span></button>';
  });
  $('picks').innerHTML=h;
}
function open(k){
  cur=k;var p=PROGRAM[k];
  ['sets','skip','warm','cool'].forEach(function(n){S[n][k]=S[n][k]||{}});
  P=0;
  $('home').hidden=true;$('workout').hidden=false;$('rt').hidden=false;
  document.body.style.setProperty('--accent',p.color);
  $('wtitle').textContent=p.em+' '+p.title;
  render();window.scrollTo(0,0);
}
function box(t){
  var arr=(t==='warm'?WARM:COOL)[cur.indexOf('push')===0?'push':'pull'],st=S[t][cur];
  var h='<div class="box"><h3>'+(t==='warm'?'Warm up 🔥':'Stretch 🧘')+'</h3>';
  arr.forEach(function(x,n){h+='<button class="chk'+(st[n]?' on':'')+'" data-t="'+t+'" data-n="'+n+'"><i>'+(st[n]?'✓':'')+'</i><span>'+x+'</span></button>'});
  return h+'</div>';
}
function render(){
  var h=box('warm');
  PROGRAM[cur].ex.forEach(function(e,i){
    var d=nDone(i),sk=!!S.skip[cur][i],g=GROUPS[GRP[e[0]]||'core'];
    h+='<div class="ex'+(d>=e[1]&&!sk?' complete':'')+(sk?' skipped':'')+'" style="--g:'+g[1]+'" data-i="'+i+'">'
     +'<span class="chip">'+g[0]+'</span><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+' sets · '+e[2]+'</div>'+lastLine(e)+'<div class="sets">'+setRows(i,e)+'</div>'
     +'<button class="skip" data-skip="'+i+'">'+(sk?'Bring it back':'Skip this one')+'</button></div>';
  });
  h+=box('cool')+'<button class="nb main fin">Finish workout ✓</button>';
  $('stage').innerHTML=h;
  wasAll=progress();
}
function progress(){
  var tot=0,dn=0,all=true;
  PROGRAM[cur].ex.forEach(function(e,i){
    if(S.skip[cur][i])return;
    tot+=e[1];var d=nDone(i);dn+=d;if(d<e[1])all=false;
  });
  $('fill').style.width=(tot?dn/tot*100:0)+'%';
  $('count').textContent=dn+' of '+tot+' sets done';
  return all&&tot>0;
}
function boom(){
  var c=document.createElement('div');c.className='confetti';
  var em=['🎉','⭐','💪','🍑','✨','🔥'],h='';
  for(var i=0;i<26;i++)h+='<span style="left:'+(Math.random()*96)+'%;animation-delay:'+(Math.random()*.8)+'s">'+em[i%em.length]+'</span>';
  c.innerHTML=h;document.body.appendChild(c);setTimeout(function(){c.remove()},3200);
}
function clearWorkout(){
  S.sets[cur]={};S.skip[cur]={};S.warm[cur]={};S.cool[cur]={};S.page[cur]=0;save();
}
function esc(v){return String(v).replace(/"/g,'&quot;')}
function tx(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function lastLine(e){
  var L=S.lastSets[e[0]];if(!L||!L.length)return '';
  return '<div class="last">Last time: '+L.map(function(r){return (r.kg!==''?tx(r.kg)+' kg × ':'')+tx(r.reps||'?')}).join(' · ')+'</div>';
}
function saveLast(){
  PROGRAM[cur].ex.forEach(function(e,i){
    var a=(S.sets[cur][i]||[]).filter(function(r){return r.done});
    if(a.length)S.lastSets[e[0]]=a.map(function(r){return {kg:r.kg,reps:r.reps}});
  });
}
function setData(i){
  var a=S.sets[cur][i]||(S.sets[cur][i]=[]),n=PROGRAM[cur].ex[i][1];
  for(var s=0;s<n;s++)a[s]=a[s]||{kg:'',reps:'',done:false};
  return a;
}
function nDone(i){return setData(i).filter(function(x){return x.done}).length}
function setRows(i,e){
  var a=setData(i),u=/sec/.test(e[2])?'sec':'reps',tr=e[2].split(' ')[0],ph=S.lastKg[e[0]]||'kg',L=S.lastSets[e[0]]||[],h='';
  a.forEach(function(r,s){
    h+='<div class="srow'+(r.done?' done':'')+'" data-s="'+s+'"><span class="snum">'+(s+1)+'</span>'
     +'<input type="text" inputmode="decimal" placeholder="'+esc((L[s]&&L[s].kg)||ph)+'" value="'+esc(r.kg)+'" data-f="kg" aria-label="Set '+(s+1)+' kg"><span class="u">kg</span>'
     +'<input type="text" inputmode="numeric" placeholder="'+esc((L[s]&&L[s].reps)||tr)+'" value="'+esc(r.reps)+'" data-f="reps" aria-label="Set '+(s+1)+' '+u+'"><span class="u">'+u+'</span>'
     +'<button class="ok'+(r.done?' on':'')+'" data-s="'+s+'" aria-label="Complete set '+(s+1)+'">✓</button></div>';
  });
  return h;
}
function toggleSet(i,s){
  var a=setData(i),r=a[s],e=PROGRAM[cur].ex[i],pv=s>0?a[s-1]:null;
  r.done=!r.done;
  if(r.done){
    var L=(S.lastSets[e[0]]||[])[s]||{};
    if(r.kg==='')r.kg=L.kg||((pv&&pv.kg!=='')?pv.kg:(S.lastKg[e[0]]||''));
    if(r.reps==='')r.reps=L.reps||((pv&&pv.reps!=='')?pv.reps:String(parseInt(e[2])||''));
    if(r.kg!=='')S.lastKg[e[0]]=r.kg;
  }
  save();
  var was=wasAll,y=window.scrollY;render();window.scrollTo(0,y);
  if(r.done){var b=$('stage').querySelector('.ex[data-i="'+i+'"] .ok[data-s="'+s+'"]');if(b)b.classList.add('pop')}
  if(wasAll&&!was)boom();
}
/* rest timer */
var tEnd=0,tInt=null,rt=$('rt');
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function tick(){
  var left=Math.ceil((tEnd-Date.now())/1000);
  if(left<=0){stopT(true);return}
  rt.textContent='⏱ '+fmt(left);
}
function startT(sec){
  clearInterval(tInt);tEnd=Date.now()+sec*1000;
  rt.classList.remove('ding');rt.classList.add('run');$('tstop').hidden=false;$('sheet').hidden=true;
  tick();tInt=setInterval(tick,250);
}
function stopT(fin){
  clearInterval(tInt);tInt=null;tEnd=0;rt.classList.remove('run');$('tstop').hidden=true;
  if(fin){
    rt.classList.add('ding');rt.textContent='Go! 💪';
    try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
    try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();
      o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();
      setTimeout(function(){o.stop();a.close()},400)}catch(e){}
    setTimeout(function(){if(!tEnd){rt.classList.remove('ding');rt.textContent='⏱ Rest'}},5000);
  }else{rt.textContent='⏱ Rest'}
}
rt.addEventListener('click',function(){$('sheet').hidden=!$('sheet').hidden});
$('sheet').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-s]');if(b)startT(+b.dataset.s);
});
$('tstop').addEventListener('click',function(){stopT(false);$('sheet').hidden=true});

$('picks').addEventListener('click',function(ev){
  var b=ev.target.closest('.pick');if(b)open(b.dataset.k);
});
$('stage').addEventListener('click',function(ev){
  if(ev.target.closest('.fin')){S.last[cur]=Date.now();saveLast();clearWorkout();boom();home();return}
  var c=ev.target.closest('.chk');
  if(c){var t=c.dataset.t,n=c.dataset.n;S[t][cur][n]=!S[t][cur][n];save();
    c.classList.toggle('on',!!S[t][cur][n]);c.querySelector('i').textContent=S[t][cur][n]?'✓':'';return}
  var b=ev.target.closest('.ok');
  if(b){toggleSet(+b.closest('.ex').dataset.i,+b.dataset.s);return}
  var k=ev.target.closest('.skip');
  if(k){var i=+k.dataset.skip;S.skip[cur][i]=!S.skip[cur][i];save();render()}
});
$('stage').addEventListener('input',function(ev){
  var f=ev.target.dataset.f;
  if(f){var row=ev.target.closest('.srow'),i=+ev.target.closest('.ex').dataset.i;setData(i)[+row.dataset.s][f]=ev.target.value;save()}
});
$('back').addEventListener('click',home);
$('reset').addEventListener('click',function(){
  if(confirm('Clear all ticks for this workout?')){clearWorkout();render()}
});
home();
</script>
</body>
</html>
